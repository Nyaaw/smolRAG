[project]
name = "smolrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nyaaw", email = "cactus318@hotmail.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "multilspy>=0.0.15",
    "qdrant-client>=1.9.0",
    "fastembed>=0.4.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
smolrag = "smolrag:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
