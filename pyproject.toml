[project]
name = "smolrag"
version = "1.1.0"
description = "Local code retrieval tool combining LSP analysis and BM25 indexing for large codebases"
readme = "README.md"
authors = [
    { name = "Nyaaw", email = "cactus318@hotmail.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "multilspy>=0.0.15",
    "qdrant-client>=1.9.0",
    "fastembed>=0.4.0",
    "platformdirs>=4.0.0",
    "openai>=2.44.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.0.0",
]

[project.scripts]
smolrag = "smolrag:main"

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
markers = [
    "lsp: tests requiring LSP server (Java 17+, JDTLS, slow startup)",
    "slow: tests that take significantly longer to run",
    "e2e: end-to-end tests that call an external LLM API (needs LLM_API_KEY)",
]
